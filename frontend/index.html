<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>E·Shop | Premium E-Commerce</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Navbar -->
<div class="navbar">
    <div class="nav-container">
        <a class="logo" onclick="showSection('products', event)">
            <div class="logo-icon">E</div>
            <div class="logo-text">E·Shop</div>
        </a>
        <div class="nav-links" id="navLinks">
            <a class="nav-link active" onclick="showSection('products', this)">
                <i class="fas fa-store"></i>
                <span>Shop</span>
            </a>
            <a class="nav-link" onclick="showSection('orders', this)">
                <i class="fas fa-receipt"></i>
                <span>Orders</span>
            </a>
            <a class="nav-link" onclick="showSection('cart', this)">
                <i class="fas fa-shopping-bag"></i>
                <span>Cart</span>
                <span id="cartCount" class="cart-badge">0</span>
            </a>
            <a class="nav-link" id="adminAnalyticsBtn" onclick="showSection('analytics', this)" style="display:none;">
                <i class="fas fa-chart-line"></i>
                <span>Analytics</span>
            </a>
        </div>
        <div id="userInfo" class="user-info">
            <div class="user-name" id="userNameDisplay"></div>
            <button class="btn-login" id="adminLoginBtn" onclick="showAdminModal()">
                <i class="fas fa-shield-alt"></i> Admin
            </button>
            <button class="btn-logout" id="logoutBtn" onclick="logout()" style="display:none">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>
    </div>
</div>

<!-- Main Container -->
<div class="container">
    
    <!-- Products Section -->
    <div id="productsSection" class="section">
        <div class="section-header">
            <div class="section-title">
                <span class="section-label">OUR CATALOG</span>
                <h2>Featured <em>Products</em></h2>
            </div>
            <div id="adminAddBtn" class="admin-actions" style="display:none;">
                <button class="btn-primary" onclick="showAddProductModal()">
                    <i class="fas fa-plus"></i> Add Product
                </button>
            </div>
        </div>
        <div id="products-list" class="product-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Curating collection...</span>
            </div>
        </div>
    </div>

    <!-- Orders Section -->
    <div id="ordersSection" class="section" style="display:none">
        <div class="section-header">
            <div class="section-title">
                <span class="section-label">HISTORY</span>
                <h2>Your <em>Orders</em></h2>
            </div>
            <button id="clearOrdersBtn" class="btn-danger" style="display:none" onclick="clearAllOrders()">
                <i class="fas fa-trash-alt"></i> Clear All
            </button>
        </div>
        <div id="orders-list" class="orders-container">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Loading orders...</span>
            </div>
        </div>
    </div>

    <!-- Cart Section -->
    <div id="cartSection" class="section" style="display:none">
        <div class="section-header">
            <div class="section-title">
                <span class="section-label">YOUR BAG</span>
                <h2>Shopping <em>Cart</em></h2>
            </div>
        </div>
        <div id="cart-container" class="cart-layout">
            <div id="cart-items" class="cart-card">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <span>Loading cart...</span>
                </div>
            </div>
            <div id="cart-summary" class="cart-summary-card">
                <h4>Order Summary</h4>
                <div id="cart-total" class="cart-total">Total: Rs. 0</div>
                <button class="btn-checkout" onclick="checkout()">
                    <i class="fas fa-lock"></i> Checkout
                </button>
            </div>
        </div>
    </div>

    <!-- Analytics Section (Admin only) -->
    <div id="analyticsSection" class="section" style="display:none">
        <div class="section-header">
            <div class="section-title">
                <span class="section-label">INSIGHTS</span>
                <h2>Admin <em>Analytics</em></h2>
            </div>
        </div>
        <div id="analytics-dashboard" class="analytics-grid">
            <div class="loading-state">
                <div class="spinner"></div>
                <span>Loading analytics...</span>
            </div>
        </div>
    </div>

</div>

<!-- Admin Login Modal -->
<div id="adminModal" class="modal">
    <div class="modal-overlay" onclick="closeAdminModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-shield-alt"></i> Admin Access</h3>
            <div class="close-modal" onclick="closeAdminModal()">✕</div>
        </div>
        <div class="input-group">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="adminPassword" placeholder="Enter password">
        </div>
        <button class="btn-primary full-width" onclick="adminLogin()">
            <i class="fas fa-key"></i> Authenticate
        </button>
        <div class="modal-hint">
            Demo: <code>admin123</code>
        </div>
    </div>
</div>

<!-- Add Product Modal (Admin only) -->
<div id="addProductModal" class="modal">
    <div class="modal-overlay" onclick="closeAddProductModal()"></div>
    <div class="modal-content">
        <div class="modal-header">
            <h3><i class="fas fa-plus-circle"></i> New Product</h3>
            <div class="close-modal" onclick="closeAddProductModal()">✕</div>
        </div>
        <div class="input-group">
            <i class="fas fa-tag input-icon"></i>
            <input type="number" id="prodId" placeholder="Product ID">
        </div>
        <div class="input-group">
            <i class="fas fa-box input-icon"></i>
            <input type="text" id="prodName" placeholder="Product Name">
        </div>
        <div class="input-group">
            <i class="fas fa-rupee-sign input-icon"></i>
            <input type="number" id="prodPrice" placeholder="Price (Rs.)" step="0.01">
        </div>
        <div class="input-group">
            <i class="fas fa-cubes input-icon"></i>
            <input type="number" id="prodQty" placeholder="Quantity">
        </div>
        <button class="btn-primary full-width" onclick="addProduct()">Create Product</button>
    </div>
</div>

<!-- Toast Message -->
<div id="toast" class="toast"></div>

<script src="script.js"></script>
</body>
</html>
